<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link href="{{ url_for('static', path='styles.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>

        <div class="task-form">
            <form action="/add" method="post">
                <input type="text" name="title" placeholder="Enter task" required>
                <button type="submit" class="action-button">Add Task</button>
            </form>
        </div>

        <div class="task-list">
            <ul>
                {% for task in tasks %}
                    <li class="task-item {% if task.completed %}completed{% endif %}">
                        <form action="/toggle/{{ task.id }}" method="post" class="complete-form">
                            <input type="checkbox" name="completed" {{ 'checked' if task.completed }} onchange="this.form.submit()">
                        </form>
                        <span class="task-title">
                            {% if task.completed %}
                                <s>{{ task.title }}</s>
                            {% else %}
                                {{ task.title }}
                            {% endif %}
                        </span>
                        <div class="task-actions">
                            <a href="/edit/{{ task.id }}" class="action-button">Edit</a>
                            <a href="/delete/{{ task.id }}" class="action-button delete-btn">Delete</a>
                        </div>
                    </li>
                {% else %}
                    <li class="no-tasks">No tasks yet! Add one above.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
